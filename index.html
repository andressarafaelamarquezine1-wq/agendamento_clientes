
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <title>Sistema de Automação de Rotas</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #1e293b;
            color: #fff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .navbar strong {
            font-size: 18px;
        }

        .navbar a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 16px;
            font-size: 14px;
        }

        .navbar a:hover {
            color: #fff;
        }

        .container {
            max-width: 960px;
            margin: 32px auto;
            background: #fff;
            padding: 28px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
        }

        h2 {
            margin-top: 0;
            color: #1e293b;
            font-size: 22px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 18px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        input, select, button {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px #bfdbfe;
        }

        button {
            background: #2563eb;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background .2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .btn-concluir {
            background: #16a34a;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-concluir:hover {
            background: #15803d;
        }

        .btn-editar, .btn-excluir {
            padding: 8px 10px;
            margin: 2px;
            white-space: nowrap;
        }

        .btn-excluir {
            background: #dc2626;
        }

        .btn-excluir:hover {
            background: #b91c1c;
        }

        .filtro-data {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .vazio {
            color: #64748b;
            font-style: italic;
            text-align: center;
            padding: 24px;
        }

        #simulacao-aviso {
            font-size: 13px;
            color: #2563eb;
            font-weight: 600;
            margin-top: -12px;
            margin-bottom: 16px;
        }

        .tabela-responsiva {
            overflow-x: auto;
        }

        @media (max-width: 600px) {
            .container {
                margin: 12px;
                padding: 16px;
            }

            .navbar {
                padding: 16px;
            }

            .navbar a {
                margin-left: 0;
                margin-right: 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <strong>Controle de Rotas</strong>
        <div>
            <a href="#" onclick="mostrarSecao('rotas'); return false;">Rotas do Dia</a>
            <a href="#" onclick="mostrarSecao('clientes'); return false;">Gestão de Clientes</a>
        </div>
    </nav>

    <main class="container">

        <!-- SEÇÃO: ROTAS DO DIA -->
        <section id="secao-rotas">
            <h2>Rotas Programadas</h2>

            <div class="filtro-data">
                <label for="filtro-data-input">Selecionar Data:</label>
                <input type="date" id="filtro-data-input">
                <button type="button" onclick="renderizarRotas()">Filtrar</button>
            </div>

            <div id="tabela-rotas-container"></div>
        </section>

        <!-- SEÇÃO: CLIENTES -->
        <section id="secao-clientes" style="display: none;">

            <h2>Cadastrar Cliente na Rota Fixa</h2>

            <form id="form-cliente" onsubmit="salvarCliente(event)" class="form-grid">

                <input type="text" id="nome" placeholder="Nome do Cliente" required>
                <input type="text" id="telefone" placeholder="Telefone / WhatsApp">
                <input type="text" id="endereco" placeholder="Endereço">
                <input type="text" id="cidade" placeholder="Cidade">

                <input
                    type="number"
                    id="dia_fixo"
                    min="1"
                    max="31"
                    placeholder="Dia fixo (1 a 31)"
                    required
                    oninput="atualizarPrevia()"
                >

                <select id="regra_fds" onchange="atualizarPrevia()">
                    <option value="PROXIMA_SEGUNDA">Se cair no FDS: Próxima Segunda</option>
                    <option value="SEXTA_ANTERIOR">Se cair no FDS: Sexta Anterior</option>
                    <option value="MANTER">Manter no FDS</option>
                </select>

                <button type="submit" id="btn-salvar-cliente" style="grid-column: 1 / -1;">
                    Salvar Cliente
                </button>

                <button
                    type="button"
                    id="btn-cancelar-edicao"
                    onclick="cancelarEdicao()"
                    style="grid-column: 1 / -1; display: none; background: #64748b;"
                >
                    Cancelar edição
                </button>

            </form>

            <div id="simulacao-aviso"></div>

            <h2>Clientes Cadastrados</h2>

            <div id="tabela-clientes-container">
                <p class="vazio">Carregando clientes...</p>
            </div>

        </section>

    </main>

    <script>

        // ENDEREÇOS POSSÍVEIS DA API
        const caminhosAPIClientes = [
            '/public/clients.php'
        ]; 

        let clientes = [];
        let clienteEditandoId = null;

        // Os atendimentos continuam temporariamente no navegador.
        let atendimentos = JSON.parse(
            localStorage.getItem('sys_atendimentos') || '[]'
        );

        if (!Array.isArray(atendimentos)) {
            atendimentos = [];
        }


        // COMUNICAÇÃO COM A API DE CLIENTES

        async function chamarAPIClientes(opcoes = {}) {

            let ultimaResposta = null;

            for (const caminho of caminhosAPIClientes) {

                const resposta = await fetch(caminho, opcoes);

                if (resposta.status !== 404) {
                    return resposta;
                }

                ultimaResposta = resposta;
            }

            return ultimaResposta;
        }


        // CARREGAR CLIENTES DO MYSQL

        async function carregarClientes() {

            const resposta = await chamarAPIClientes();

            if (!resposta || !resposta.ok) {
                throw new Error(
                    'Não foi possível carregar os clientes. Verifique o endereço da API e o servidor PHP.'
                );
            }

            const dados = await resposta.json();

            if (!Array.isArray(dados)) {
                throw new Error(
                    'A API não retornou uma lista válida de clientes.'
                );
            }

            clientes = dados;

            renderizarClientes();
        }


        // FORMATAÇÃO DE DATA

        function formatarDataISO(data) {

            const ano = data.getFullYear();

            const mes = String(data.getMonth() + 1).padStart(2, '0');

            const dia = String(data.getDate()).padStart(2, '0');

            return `${ano}-${mes}-${dia}`;
        }


        // PROTEÇÃO DOS DADOS EXIBIDOS NO HTML

        function escaparHTML(valor) {

            return String(valor ?? '').replace(/[&<>"']/g, caractere => {

                const entidades = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };

                return entidades[caractere];

            });
        }


        // SALVAR ATENDIMENTOS NO NAVEGADOR

        function salvarAtendimentosNoNavegador() {

            localStorage.setItem(
                'sys_atendimentos',
                JSON.stringify(atendimentos)
            );

        }


        // ALTERNAR ENTRE AS ABAS

        function mostrarSecao(secao) {

            document.getElementById('secao-rotas').style.display =
                secao === 'rotas' ? 'block' : 'none';

            document.getElementById('secao-clientes').style.display =
                secao === 'clientes' ? 'block' : 'none';

            if (secao === 'rotas') {

                renderizarRotas();

            }

            if (secao === 'clientes') {

                carregarClientes().catch(erro => {

                    console.error(erro);

                    document.getElementById(
                        'tabela-clientes-container'
                    ).innerHTML =
                        `<p class="vazio">${escaparHTML(erro.message)}</p>`;

                });

            }

        }


        // CALCULAR DATA DA ROTA

        function calcularDataRotaJS(ano, mes, diaFixo, regra) {

            const ultimoDiaDoMes = new Date(ano, mes, 0).getDate();

            const diaValido = Math.min(Number(diaFixo), ultimoDiaDoMes);

            let data = new Date(ano, mes - 1, diaValido);

            const diaSemana = data.getDay();

            if (regra === 'PROXIMA_SEGUNDA') {

                if (diaSemana === 6) {

                    data.setDate(data.getDate() + 2);

                } else if (diaSemana === 0) {

                    data.setDate(data.getDate() + 1);

                }

            } else if (regra === 'SEXTA_ANTERIOR') {

                if (diaSemana === 6) {

                    data.setDate(data.getDate() - 1);

                } else if (diaSemana === 0) {

                    data.setDate(data.getDate() - 2);

                }

            }

            return data;

        }


        // GERAR ROTAS DO MÊS ATUAL

        // Os atendimentos ainda são armazenados no navegador.
        // A integração deles com o MySQL será feita em outra etapa.

        function gerarRotasDoMesAtual() {

            const hoje = new Date();

            const ano = hoje.getFullYear();

            const mes = hoje.getMonth() + 1;

            const competencia =
                `${ano}-${String(mes).padStart(2, '0')}-01`;

            clientes.forEach(cliente => {

                const diaFixo =
                    cliente.dia_fixo_atendimento ?? cliente.dia_fixo;

                const regra =
                    cliente.regra_fim_de_semana ?? cliente.regra_fds;

                const dataPrevista = calcularDataRotaJS(
                    ano,
                    mes,
                    diaFixo,
                    regra
                );

                const dataFormatada = formatarDataISO(dataPrevista);

                const existe = atendimentos.some(atendimento =>

                    String(atendimento.cliente_id) === String(cliente.id) &&
                    atendimento.competencia === competencia

                );

                if (!existe) {

                    atendimentos.push({

                        id: Date.now() + Math.random(),

                        cliente_id: cliente.id,

                        competencia: competencia,

                        data_prevista: dataFormatada,

                        status: 'Pendente'

                    });

                }

            });

            salvarAtendimentosNoNavegador();

        }


        // RENDERIZAR ROTAS DO DIA

        function renderizarRotas() {

            gerarRotasDoMesAtual();

            const inputData =
                document.getElementById('filtro-data-input');

            if (!inputData.value) {

                inputData.value = formatarDataISO(new Date());

            }

            const dataFiltro = inputData.value;

            const container =
                document.getElementById('tabela-rotas-container');

            const rotasDoDia = atendimentos.filter(atendimento =>

                atendimento.data_prevista === dataFiltro &&
                atendimento.status === 'Pendente'

            );

            if (rotasDoDia.length === 0) {

                container.innerHTML =
                    '<p class="vazio">Nenhum atendimento pendente para esta data.</p>';

                return;

            }

            let html = `
                <div class="tabela-responsiva">
                    <table>
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Telefone</th>
                                <th>Endereço / Cidade</th>
                                <th>Status</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            rotasDoDia.forEach(rota => {

                const cliente = clientes.find(c =>

                    String(c.id) === String(rota.cliente_id)

                );

                if (cliente) {

                    html += `
                        <tr>
                            <td>${escaparHTML(cliente.nome)}</td>

                            <td>${escaparHTML(cliente.telefone || '-')}</td>

                            <td>
                                ${escaparHTML(cliente.endereco || '-')}
                                -
                                ${escaparHTML(cliente.cidade || '-')}
                            </td>

                            <td>${escaparHTML(rota.status)}</td>

                            <td>
                                <button
                                    type="button"
                                    class="btn-concluir"
                                    onclick="concluirAtendimento('${String(rota.id)}')"
                                >
                                    Concluir
                                </button>
                            </td>
                        </tr>
                    `;

                }

            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;

        }


        // CONCLUIR ATENDIMENTO

        function concluirAtendimento(id) {

            atendimentos = atendimentos.map(atendimento =>

                String(atendimento.id) === String(id)

                    ? { ...atendimento, status: 'Concluído' }

                    : atendimento

            );

            salvarAtendimentosNoNavegador();

            renderizarRotas();

        }


        // CANCELAR EDIÇÃO

        function cancelarEdicao() {

            clienteEditandoId = null;

            document.getElementById('form-cliente').reset();

            document.getElementById('simulacao-aviso').textContent = '';

            document.getElementById('btn-salvar-cliente').textContent =
                'Salvar Cliente';

            document.getElementById('btn-cancelar-edicao').style.display =
                'none';

        }


        // CADASTRAR OU EDITAR CLIENTE NO MYSQL

        async function salvarCliente(event) {

            event.preventDefault();

            const diaFixo = parseInt(
                document.getElementById('dia_fixo').value,
                10
            );

            if (
                !Number.isInteger(diaFixo) ||
                diaFixo < 1 ||
                diaFixo > 31
            ) {

                alert('Informe um dia fixo entre 1 e 31.');

                return;

            }

            const dadosCliente = {

                nome: document.getElementById('nome').value.trim(),

                telefone: document.getElementById('telefone').value.trim(),

                endereco: document.getElementById('endereco').value.trim(),

                cidade: document.getElementById('cidade').value.trim(),

                dia_fixo_atendimento: diaFixo,

                regra_fim_de_semana:
                    document.getElementById('regra_fds').value

            };

            const estaEditando = clienteEditandoId !== null;

            if (estaEditando) {

                dadosCliente.id = clienteEditandoId;

            }

            const botaoSalvar =
                document.getElementById('btn-salvar-cliente');

            botaoSalvar.disabled = true;

            try {

                const resposta = await chamarAPIClientes({

                    method: estaEditando ? 'PUT' : 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(dadosCliente)

                });

                const resultado = await resposta.json();

                if (!resposta.ok || !resultado.sucesso) {

                    throw new Error(
                        resultado.erro ||
                        'Não foi possível salvar o cliente.'
                    );

                }

                await carregarClientes();

                cancelarEdicao();

                alert(
                    estaEditando
                        ? 'Cliente atualizado com sucesso!'
                        : 'Cliente cadastrado com sucesso!'
                );

                renderizarRotas();

            } catch (erro) {

                console.error(erro);

                alert('Erro ao salvar cliente: ' + erro.message);

            } finally {

                botaoSalvar.disabled = false;

            }

        }


        // RENDERIZAR CLIENTES CADASTRADOS

        function renderizarClientes() {

            const container =
                document.getElementById('tabela-clientes-container');

            if (clientes.length === 0) {

                container.innerHTML =
                    '<p class="vazio">Nenhum cliente cadastrado.</p>';

                return;

            }

            let html = `
                <div class="tabela-responsiva">
                    <table>
                        <thead>
                            <tr>
                                <th>Dia Fixo</th>
                                <th>Cliente</th>
                                <th>Telefone</th>
                                <th>Cidade</th>
                                <th>Regra FDS</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            clientes.forEach(cliente => {

                const dia =
                    cliente.dia_fixo_atendimento ?? cliente.dia_fixo;

                const regra =
                    cliente.regra_fim_de_semana ?? cliente.regra_fds;

                let regraTexto = 'Manter no FDS';

                if (regra === 'PROXIMA_SEGUNDA') {

                    regraTexto = 'Próxima Segunda';

                } else if (regra === 'SEXTA_ANTERIOR') {

                    regraTexto = 'Sexta Anterior';

                }

                html += `
                    <tr>
                        <td>
                            <strong>Todo dia ${escaparHTML(dia)}</strong>
                        </td>

                        <td>${escaparHTML(cliente.nome)}</td>

                        <td>${escaparHTML(cliente.telefone || '-')}</td>

                        <td>${escaparHTML(cliente.cidade || '-')}</td>

                        <td>${escaparHTML(regraTexto)}</td>

                        <td>
                            <button
                                type="button"
                                class="btn-editar"
                                onclick="editarCliente(${Number(cliente.id)})"
                            >
                                ✏️ Editar
                            </button>

                            <button
                                type="button"
                                class="btn-excluir"
                                onclick="excluirCliente(${Number(cliente.id)})"
                            >
                                🗑️ Excluir
                            </button>
                        </td>
                    </tr>
                `;

            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;

        }


        // PREENCHER O FORMULÁRIO PARA EDIÇÃO

        function editarCliente(id) {

            const cliente = clientes.find(c =>

                String(c.id) === String(id)

            );

            if (!cliente) {

                alert('Cliente não encontrado.');

                return;

            }

            clienteEditandoId = cliente.id;

            document.getElementById('nome').value =
                cliente.nome || '';

            document.getElementById('telefone').value =
                cliente.telefone || '';

            document.getElementById('endereco').value =
                cliente.endereco || '';

            document.getElementById('cidade').value =
                cliente.cidade || '';

            document.getElementById('dia_fixo').value =
                cliente.dia_fixo_atendimento ??
                cliente.dia_fixo ??
                '';

            document.getElementById('regra_fds').value =
                cliente.regra_fim_de_semana ??
                cliente.regra_fds ??
                'PROXIMA_SEGUNDA';

            document.getElementById('simulacao-aviso').textContent =
                'Editando cliente: ' + cliente.nome;

            document.getElementById('btn-salvar-cliente').textContent =
                'Atualizar Cliente';

            document.getElementById('btn-cancelar-edicao').style.display =
                'block';

            document.getElementById('form-cliente').scrollIntoView({
                behavior: 'smooth'
            });

        }


        // EXCLUIR (DESATIVAR) CLIENTE NO MYSQL

        async function excluirCliente(id) {

            const cliente = clientes.find(c =>

                String(c.id) === String(id)

            );

            if (!cliente) {

                alert('Cliente não encontrado.');

                return;

            }

            const confirmar = confirm(
                `Tem certeza de que deseja excluir o cliente "${cliente.nome}"?`
            );

            if (!confirmar) {

                return;

            }

            try {

                const resposta = await chamarAPIClientes({

                    method: 'DELETE',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({ id: id })

                });

                const resultado = await resposta.json();

                if (!resposta.ok || !resultado.sucesso) {

                    throw new Error(
                        resultado.erro ||
                        'Não foi possível excluir o cliente.'
                    );

                }

                if (String(clienteEditandoId) === String(id)) {

                    cancelarEdicao();

                }

                await carregarClientes();

                renderizarRotas();

                alert('Cliente excluído com sucesso!');

            } catch (erro) {

                console.error(erro);

                alert('Erro ao excluir cliente: ' + erro.message);

            }

        }


        // ATUALIZAR PRÉVIA DA DATA

        function atualizarPrevia() {

            const dia = parseInt(
                document.getElementById('dia_fixo').value,
                10
            );

            const regra =
                document.getElementById('regra_fds').value;

            const aviso =
                document.getElementById('simulacao-aviso');

            if (!dia || dia < 1 || dia > 31) {

                aviso.textContent = '';

                return;

            }

            const hoje = new Date();

            let proximoMes = hoje.getMonth() + 2;

            let ano = hoje.getFullYear();

            if (proximoMes > 12) {

                proximoMes = 1;

                ano++;

            }

            const dataAjustada = calcularDataRotaJS(
                ano,
                proximoMes,
                dia,
                regra
            );

            const diasSemana = [
                'Domingo',
                'Segunda-feira',
                'Terça-feira',
                'Quarta-feira',
                'Quinta-feira',
                'Sexta-feira',
                'Sábado'
            ];

            aviso.textContent =
                `💡 Simulação do próximo mês: ${dataAjustada.toLocaleDateString('pt-BR')} (${diasSemana[dataAjustada.getDay()]})`;

        }


        // INICIALIZAÇÃO DA PÁGINA

        document.addEventListener('DOMContentLoaded', async () => {

            const inputData =
                document.getElementById('filtro-data-input');

            inputData.value = formatarDataISO(new Date());

            try {

                await carregarClientes();

                renderizarRotas();

            } catch (erro) {

                console.error(erro);

                document.getElementById(
                    'tabela-clientes-container'
                ).innerHTML =
                    `<p class="vazio">${escaparHTML(erro.message)}</p>`;

                document.getElementById(
                    'tabela-rotas-container'
                ).innerHTML =
                    '<p class="vazio">Não foi possível carregar os clientes para montar as rotas.</p>';

            }

        });

    </script>

    <!-- SUPORTE A PWA / APP DE CELULAR -->

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1e293b">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="assets/img/icon-192.png">


    <!-- REGISTRAR SERVICE WORKER -->

    <script>

        if ('serviceWorker' in navigator) {

            navigator.serviceWorker.register('sw.js')

                .then(() => console.log('Service Worker registrado com sucesso!'))

                .catch(err => console.log('Erro ao registrar Service Worker:', err));

        }

    </script>
    <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>

</body>
</html>
