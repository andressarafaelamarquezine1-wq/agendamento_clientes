<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Automação de Rotas</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; background: #f4f6f8; color: #222; }
        .navbar { background: #1e293b; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar strong { font-size: 18px; }
        .navbar div a { color: #cbd5e1; text-decoration: none; margin-left: 16px; font-size: 14px; }
        .navbar div a:hover { color: #fff; }
        .container { max-width: 960px; margin: 32px auto; background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        h2 { margin-top: 0; color: #1e293b; font-size: 22px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
        th { background: #f8fafc; color: #475569; font-weight: 600; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 24px; background: #f8fafc; padding: 18px; border-radius: 6px; border: 1px solid #e2e8f0; }
        input, select, button { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #2563eb; ring: 2px solid #bfdbfe; }
        button { background: #2563eb; color: #fff; border: none; cursor: pointer; font-weight: 600; transition: background .2s; }
        button:hover { background: #1d4ed8; }
        .btn-concluir { background: #16a34a; padding: 6px 12px; font-size: 13px; }
        .btn-concluir:hover { background: #15803d; }
        .filtro-data { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; }
        .vazio { color: #64748b; font-style: italic; text-align: center; padding: 24px; }
        #simulacao-aviso { font-size: 13px; color: #2563eb; font-weight: 600; margin-top: -12px; margin-bottom: 16px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <strong>Controle de Rotas</strong>
        <div>
            <a href="#" onclick="mostrarSecao('rotas')">Rotas do Dia</a>
            <a href="#" onclick="mostrarSecao('clientes')">Gestão de Clientes</a>
        </div>
    </nav>

    <main class="container">

        <!-- SEÇÃO: ROTAS DO DIA -->
        <section id="secao-rotas">
            <h2>Rotas Programadas para Hoje</h2>
            
            <div class="filtro-data">
                <label for="filtro-data-input">Selecionar Data:</label>
                <input type="date" id="filtro-data-input">
                <button onclick="carregarRotasDoDia()">Filtrar</button>
            </div>

            <div id="tabela-rotas-container">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>

        <!-- SEÇÃO: CLIENTES -->
        <section id="secao-clientes" style="display: none;">
            <h2>Cadastrar Cliente na Rota Fixa</h2>

            <form id="form-cliente" onsubmit="salvarCliente(event)" class="form-grid">
                <input type="text" id="nome" placeholder="Nome do Cliente" required>
                <input type="text" id="telefone" placeholder="Telefone / WhatsApp">
                <input type="text" id="endereco" placeholder="Endereço">
                <input type="text" id="cidade" placeholder="Cidade">
                <input type="number" id="dia_fixo" min="1" max="31" placeholder="Dia fixo (1 a 31)" required oninput="atualizarPrevia()">
                <select id="regra_fds" onchange="atualizarPrevia()">
                    <option value="PROXIMA_SEGUNDA">Se cair no FDS: Próxima Segunda</option>
                    <option value="SEXTA_ANTERIOR">Se cair no FDS: Sexta Anterior</option>
                    <option value="MANTER">Manter no FDS</option>
                </select>
                <button type="submit" style="grid-column: 1 / -1;">Salvar Cliente</button>
            </form>
            <div id="simulacao-aviso"></div>

            <h2>Clientes Cadastrados</h2>
            <div id="tabela-clientes-container">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>

    </main>

    <script>
        // Simulação de banco de dados local no navegador (LocalStorage)
        let clientes = JSON.parse(localStorage.getItem('sys_clientes')) || [
            { id: 1, nome: 'Supermercado Central', telefone: '(42) 9999-1111', endereco: 'Rua Principal, 100', cidade: 'Guarapuava', dia_fixo: 10, regra_fds: 'PROXIMA_SEGUNDA' },
            { id: 2, nome: 'Comércio Silva', telefone: '(42) 9888-2222', endereco: 'Av. Brasil, 500', cidade: 'Guarapuava', dia_fixo: 15, regra_fds: 'SEXTA_ANTERIOR' }
        ];

        let atendimentos = JSON.parse(localStorage.getItem('sys_atendimentos')) || [];

        // Alternar entre abas
        function mostrarSecao(secao) {
            document.getElementById('secao-rotas').style.display = secao === 'rotas' ? 'block' : 'none';
            document.getElementById('secao-clientes').style.display = secao === 'clientes' ? 'block' : 'none';
            if (secao === 'rotas') renderizarRotas();
            if (secao === 'clientes') renderizarClientes();
        }

        // Lógica de cálculo de dias úteis em JS
        function calcularDataRotaJS(ano, mes, diaFixo, regra) {
            const ultimoDiaDoMes = new Date(ano, mes, 0).getDate();
            const diaValido = Math.min(diaFixo, ultimoDiaDoMes);
            let data = new Date(ano, mes - 1, diaValido);
            let diaSemana = data.getDay();

            if (regra === 'PROXIMA_SEGUNDA') {
                if (diaSemana === 6) data.setDate(data.getDate() + 2);
                else if (diaSemana === 0) data.setDate(data.getDate() + 1);
            } else if (regra === 'SEXTA_ANTERIOR') {
                if (diaSemana === 6) data.setDate(data.getDate() - 1);
                else if (diaSemana === 0) data.setDate(data.getDate() - 2);
            }
            return data;
        }

        function formatarDataBR(data) {
            const d = String(data.getDate()).padStart(2, '0');
            const m = String(data.getMonth() + 1).padStart(2, '0');
            const y = data.getFullYear();
            return `${y}-${m}-${d}`; // Formato para input date
        }

        // Inicializar datas e gerar rotas automáticas do mês atual baseadas nos clientes
        function gerarRotasDoMesAtual() {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = hoje.getMonth() + 1;
            
            clientes.forEach(c => {
                const dataPrevistaObj = calcularDataRotaJS(ano, mes, c.dia_fixo, c.regra_fds);
                const dataFormatada = formatarDataBR(dataPrevistaObj);
                
                // Verifica se já existe atendimento para este cliente neste mês
                const existe = atendimentos.find(a => a.cliente_id === c.id && a.competencia === `${ano}-${String(mes).padStart(2, '0')}-01`);
                if (!existe) {
                    atendimentos.push({
                        id: Date.now() + Math.random(),
                        cliente_id: c.id,
                        competencia: `${ano}-${String(mes).padStart(2, '0')}-01`,
                        data_prevista: dataFormatada,
                        status: 'Pendente'
                    });
                }
            });
            localStorage.setItem('sys_atendimentos', JSON.stringify(atendimentos));
        }

        // Renderizar Rotas do Dia
        function renderizarRotas() {
            gerarRotasDoMesAtual();
            const inputData = document.getElementById('filtro-data-input');
            if (!inputData.value) {
                inputData.value = new Date().toISOString().split('T')[0];
            }
            
            const dataFiltro = inputData.value;
            const container = document.getElementById('tabela-rotas-container');
            
            const rotasDoDia = atendimentos.filter(a => a.data_prevista === dataFiltro && a.status === 'Pendente');

            if (rotasDoDia.length === 0) {
                container.innerHTML = `<p class="vazio">Nenhum atendimento pendente para esta data.</p>`;
                return;
            }

            let html = `<table><thead><tr><th>Cliente</th><th>Telefone</th><th>Endereço / Cidade</th><th>Status</th><th>Ação</th></tr></thead><tbody>`;
            rotasDoDia.forEach(r => {
                const cliente = clientes.find(c => c.id === r.cliente_id);
                if (cliente) {
                    html += `<tr>
                        <td>${cliente.nome}</td>
                        <td>${cliente.telefone || '-'}</td>
                        <td>${cliente.endereco} - ${cliente.cidade}</td>
                        <td>${r.status}</td>
                        <td><button class="btn-concluir" onclick="concluirAtendimento(${r.id})">Concluir</button></td>
                    </tr>`;
                }
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function concluirAtendimento(id) {
            atendimentos = atendimentos.map(a => a.id === id ? {...a, status: 'Concluído'} : a);
            localStorage.setItem('sys_atendimentos', JSON.stringify(atendimentos));
            renderizarRotas();
        }

        // Gestão de Clientes
        function salvarCliente(event) {
            event.preventDefault();
            const novo = {
                id: Date.now(),
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                endereco: document.getElementById('endereco').value,
                cidade: document.getElementById('cidade').value,
                dia_fixo: parseInt(document.getElementById('dia_fixo').value, 10),
                regra_fds: document.getElementById('regra_fds').value
            };
            clientes.push(novo);
            localStorage.setItem('sys_clientes', JSON.stringify(clientes));
            document.getElementById('form-cliente').reset();
            document.getElementById('simulacao-aviso').textContent = '';
            renderizarClientes();
            alert('Cliente cadastrado com sucesso!');
        }

        function renderizarClientes() {
            const container = document.getElementById('tabela-clientes-container');
            if (clientes.length === 0) {
                container.innerHTML = `<p class="vazio">Nenhum cliente cadastrado.</p>`;
                return;
            }
            let html = `<table><thead><tr><th>Dia Fixo</th><th>Cliente</th><th>Telefone</th><th>Cidade</th><th>Regra FDS</th></tr></thead><tbody>`;
            clientes.forEach(c => {
                html += `<tr>
                    <td><strong>Todo dia ${c.dia_fixo}</strong></td>
                    <td>${c.nome}</td>
                    <td>${c.telefone || '-'}</td>
                    <td>${c.cidade || '-'}</td>
                    <td>${c.regra_fds}</td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function atualizarPrevia() {
            const dia = parseInt(document.getElementById('dia_fixo').value, 10);
            const regra = document.getElementById('regra_fds').value;
            const aviso = document.getElementById('simulacao-aviso');

            if (!dia || dia < 1 || dia > 31) {
                aviso.textContent = '';
                return;
            }

            const hoje = new Date();
            let proxMes = hoje.getMonth() + 2;
            let ano = hoje.getFullYear();
            if (proxMes > 12) { proxMes = 1; ano++; }

            const dataAjustada = calcularDataRotaJS(ano, proxMes, dia, regra);
            const diasSemana = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
            
            aviso.textContent = `💡 Simulação do próximo mês: ${dataAjustada.toLocaleDateString('pt-BR')} (${diasSemana[dataAjustada.getDay()]})`;
        }


        // Inicializa aba padrão
        renderizarRotas();
    </script>

    <!-- Suporte a PWA / App de Celular -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">

<!-- Script para registrar o Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker registrado com sucesso!'))
      .catch((err) => console.log('Erro ao registrar Service Worker:', err));
  }
</script>
</body>
</html>
